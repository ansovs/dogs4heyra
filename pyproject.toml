[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogs4heyra"
version = "0.1.0"
description = "Extracts dog breed data from The Dog API"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "duckdb>=1.0",
]
warehouse = [
    "dlt[bigquery]>=1.0",
]
transform = [
    "dbt-core>=1.8",
    "dbt-bigquery>=1.8",
]

[project.scripts]
dogs4heyra-extract = "dogs4heyra.extract:main"
dogs4heyra-load = "dogs4heyra.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
