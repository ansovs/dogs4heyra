[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogs4heyra"
version = "0.1.0"
description = "Extracts dog breed data from The Dog API"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
dogs4heyra-extract = "dogs4heyra.extract:main"

[tool.setuptools.packages.find]
where = ["src"]
