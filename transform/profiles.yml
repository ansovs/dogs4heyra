# No secrets live in this file — values come from env vars at run time
# (see scripts/print_bq_env.py). Safe to commit.
dogs4heyra:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('BQ_PROJECT_ID') }}"
      dataset: dog_breeds_staging
      location: US
      threads: 4
      keyfile_json:
        type: service_account
        project_id: "{{ env_var('BQ_PROJECT_ID') }}"
        client_email: "{{ env_var('BQ_CLIENT_EMAIL') }}"
        private_key: "{{ env_var('BQ_PRIVATE_KEY') }}"
        token_uri: https://oauth2.googleapis.com/token
