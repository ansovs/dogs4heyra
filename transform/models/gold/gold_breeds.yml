version: 2

models:
  - name: gold_breeds
    description: >
      Dashboard/reporting-ready breed dimension: a curated subset of
      silver_breeds, materialized as a table for consistent BI query
      performance.
    columns:
      - name: breed_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_breeds')
                field: id
      - name: breed_name
        data_tests:
          - not_null
          - unique:
              # Same known upstream duplicate as silver_breeds
              # ("Caucasian Shepherd Dog", ids 269 and 70) -- warn, not
              # error.
              config:
                severity: warn
