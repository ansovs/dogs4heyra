version: 2

models:
  - name: silver_breeds
    description: >
      One current-state row per breed. `bronze_breeds` accumulates a full
      snapshot per load (append), so a breed can span many bronze rows
      over time; this collapses them by taking, per column, the most
      recent non-null value across all of that breed's history (see the
      `last_non_null` macro) -- no redundancy, no data loss, latest
      non-null value wins per field. Numeric ranges (life span, weight,
      height) are parsed out of the API's free-text fields into min/max
      columns, and temperament is normalized to lowercase/deduplicated.
    columns:
      - name: id
        description: Primary key, from The Dog API.
        data_tests:
          - unique
          - not_null
      - name: breed_name
        data_tests:
          - not_null
          - unique:
              # Not an error: "Caucasian Shepherd Dog" genuinely appears
              # twice under different ids (269, 70) with near-identical
              # descriptions -- looks like a real upstream data issue,
              # not a bug here. Warn so it stays visible without
              # blocking CI.
              config:
                severity: warn
      - name: breed_group
        data_tests:
          - not_null
      - name: species_id
        description: From The Dog API; not yet cross-referenced against anything.
        data_tests:
          - not_null
      - name: image_url
        data_tests:
          - not_null
      - name: temperament_list
        description: Lowercased, deduplicated, from the API's free-text temperament field.
      - name: perfect_for
        description: >
          From The Dog API. No breed has had a non-null value for this in
          any load so far, so it's currently always null here too -- kept
          as a placeholder column, ready to populate once raw data for it
          actually appears.
      - name: good_for_families
        description: >
          Heuristic flag: true if temperament_list contains any
          family-friendly trait (affectionate, friendly, gentle, playful,
          devoted, patient, docile, good-natured, sweet-tempered, calm).
          A first pass, not a validated classification -- description/
          history text was checked and is too sparse (50/631 breeds
          mention "family" at all) to key off of directly.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: good_for_apartments
        description: >
          Heuristic flag: true if temperament_list contains a low-energy
          trait (calm, docile, adaptable, gentle, easygoing), contains
          none of the high-energy traits (energetic, athletic,
          work-focused), and weight_metric_max_kg is 25kg or under
          (roughly the dataset's median). A first pass, not a validated
          classification.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
